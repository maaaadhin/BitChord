name: BitChord Proxy Build

on:
  workflow_dispatch:
  push:
    branches:
      - webshare-proxy
      - webshare-proxy-upgrade
      - experimental-sabr

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore permanent debug keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BITCHORD_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.config/.android
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > ~/.config/.android/debug.keystore
          chmod 600 ~/.config/.android/debug.keystore
          keytool -list -keystore ~/.config/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify InnerTubeX dependency
        run: ./gradlew :app:dependencyInsight --dependency innertubex --configuration devDebugRuntimeClasspath

      - name: Verify APK signing configuration
        run: ./gradlew :app:signingReport

      - name: Run playback regression tests
        if: github.ref_name == 'experimental-sabr'
        run: |
          ./gradlew :app:testDevDebugUnitTest \
            --tests '*DirectAudioStreamingRegressionTest' \
            --tests '*CachedContainerTest' \
            --tests '*PlaybackFallbackTest' \
            -Pbitchord.bundleWear=false --stacktrace

      - name: Build Dev APK
        run: ./gradlew :app:assembleDevDebug -Pbitchord.bundleWear=false --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Proxy
          path: app/build/outputs/apk/dev/debug/*arm64-v8a*.apk
          if-no-files-found: error
