name: BitChord Proxy Build

on:
  workflow_dispatch:
  push:
    branches:
      - webshare-proxy

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Dev APK
        run: ./gradlew :app:assembleDevDebug -Pbitchord.bundleWear=false --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Proxy
          path: app/build/outputs/apk/dev/debug/*arm64-v8a*.apk
          if-no-files-found: error
